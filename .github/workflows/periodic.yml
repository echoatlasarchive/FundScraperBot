name: Weekly and monthly reports

on:
  # GitHub's own scheduler is not the trigger here -- see daily.yml and
  # HANDOFF. This workflow had exactly one chance in its first week, Monday
  # 2026-08-24, and GitHub skipped it: no weekly report had ever gone out.
  #
  # An external scheduler (cron-job.org) calls this endpoint instead, twice
  # each for the weekly and monthly report, after the daily run has stored the
  # session these reports read:
  #
  #   POST /repos/echoatlasarchive/FundScraperBot/actions/workflows/periodic.yml/dispatches
  #   { "ref": "main", "inputs": { "report": "weekly" } }    -- Mondays, 12:15 and 12:35 Istanbul
  #   { "ref": "main", "inputs": { "report": "monthly" } }   -- 1st of the month, 12:20 and 12:40 Istanbul
  #
  # Separate times for weekly and monthly, not a shared pair, so the two jobs
  # in cron-job.org never collide when the 1st of the month happens to be a
  # Monday.
  #
  # Same token as daily.yml's workflow_dispatch trigger: a fine-grained PAT
  # scoped to this repository with Actions: read and write, kept in the
  # scheduler's configuration and never committed here.
  #
  # Firing this twice is deliberate -- a second chance if GitHub drops the
  # first -- and is made safe by cli.main()'s own dedup (a "sent today" marker
  # committed by the step below), not by anything about reading a snapshot.
  # An earlier version of this comment claimed the two attempts would
  # naturally agree and the owner would "simply get it once"; that was never
  # true; nothing before 2026-08-26 stopped both attempts from sending the
  # same report twice.
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to run"
        type: choice
        options: [weekly, monthly]
        default: weekly

permissions:
  contents: write

# Same group as daily.yml, deliberately -- concurrency groups are enforced
# across the whole repository, not per workflow, so this queues behind an
# in-progress daily run instead of racing it. Two things that needs:
#   1. Git safety: both workflows commit to data/, and a periodic push landing
#      mid-way through daily's own commit would conflict.
#   2. Freshness: the first periodic attempt (12:15/12:20 Istanbul) fires only
#      five or ten minutes after daily's first attempt (12:10), which typically
#      takes 20-30 minutes end to end. Without serialising, that attempt would
#      read yesterday's snapshot as "current" instead of waiting for today's.
#      Queuing behind daily's run means it starts only once the new session is
#      actually stored.
concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Choose the report
        id: pick
        run: |
          # workflow_dispatch is the only trigger, and its "report" input
          # always has a value -- "weekly" by default when a caller omits it,
          # exactly as when someone runs this by hand from the Actions tab.
          echo "kind=${{ inputs.report }}" >> "$GITHUB_OUTPUT"

      # Reads the snapshots the daily workflow committed; fetches nothing itself.
      - name: Send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.cli ${{ steps.pick.outputs.kind }}

      # cron-job.org fires this workflow twice per occasion (a second attempt
      # in case the first is skipped by GitHub), and unlike the daily report
      # there is no fetched-data fingerprint to notice a repeat with -- both
      # attempts would read the identical stored snapshot. cli.main() marks
      # today's send in data/state/sent_<kind>.json right after delivering, and
      # refuses to send again the same calendar day; that marker has to be
      # committed for the second attempt to see it.
      - name: Commit the send marker
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data/state
          if git diff --staged --quiet; then
            echo "Nothing to commit (already marked, or the send was skipped)."
          else
            git commit -m "data: mark ${{ steps.pick.outputs.kind }} report sent $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
