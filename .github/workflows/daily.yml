name: Daily report

on:
  schedule:
    # The report has to land before the 13:30 Istanbul fund-order cutoff, and
    # two things stand in the way: GitHub queues scheduled runs (measured 62 and
    # 63 minutes late on consecutive days, both for an on-the-hour cron), and a
    # full run takes about 25 minutes.
    #
    # So: fire early, fire repeatedly, and off the hour -- the top of the hour is
    # the most congested slot. Each attempt probes five funds first and exits in
    # seconds unless TEFAS has published a session we have not stored, so the
    # first attempt that finds fresh data sends and the rest cost nothing.
    #
    # 05:20 UTC == 08:20 Istanbul, through 09:20 UTC == 12:20 Istanbul.
    - cron: "20 5,6,7,8,9 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Scanning the full universe (~2,530 funds) takes about 15 minutes and
    # the KAP pass another 7, so the budget has headroom over that.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # KAP's disclosure list is only reachable through a real browser; see the
      # module docstring in src/kap.py. Cached so the ~100 MB download does not
      # repeat on every run.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Fetch, store and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEFAS_TOKEN: ${{ secrets.TEFAS_TOKEN }}
        run: |
          # Scheduled attempts stay quiet unless there is a new session; a
          # manual dispatch always reports, so it stays useful for testing.
          python -m src.cli daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ github.event_name == 'schedule' && '--only-if-new' || '' }}

      - name: Commit the snapshot
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            # The scheduled runs never overlap, but a manual dispatch might.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
