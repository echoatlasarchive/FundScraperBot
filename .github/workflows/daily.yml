name: Daily report

on:
  schedule:
    # 08:20, 09:20 and 10:20 UTC == 11:20, 12:20 and 13:20 Istanbul, weekdays.
    #
    # The HOUR is TEFAS and is the one constant across every version of this
    # file: nothing may fetch before the platform has finished, about 11:00
    # Istanbul. Fetching earlier is what printed PHE at -100% (HANDOFF 4a), so
    # every attempt here sits after that line and none of them can repeat it.
    #
    # The COUNT is GitHub, which does not run these reliably. Measured over the
    # first seven weekdays:
    #
    #   18 Aug  cron 09:00  ->  10:02Z   +62 min
    #   19 Aug  cron 09:00  ->  10:03Z   +63 min
    #   20 Aug  five crons  ->  07:29Z   one of five fired
    #   21 Aug  cron 08:20  ->  10:00Z   +100 min
    #   24 Aug  cron 08:20  ->  never    skipped
    #   25 Aug  crons 08:20, 09:20 -> 10:00Z   08:20 skipped, 09:20 saved it
    #   26 Aug  cron 08:20  ->  never    skipped
    #
    # A single attempt failed on two of its four days. Three attempts is the
    # cheapest answer available inside GitHub: cli.session_is_published()
    # probes five funds and exits in seconds once a session has been reported,
    # so the extra attempts cost nothing on a normal day.
    #
    # 13:20 is deliberately the last: the run takes ~30 minutes, so a later one
    # would finish past the 13:30 fund-order cutoff the report exists to beat.
    # It is kept as a backstop -- a late report still beats none.
    #
    # This is best-effort and stays best-effort. The reliable trigger is the
    # repository_dispatch below.
    - cron: "20 8,9,10 * * 1-5"

  # Two ways for an outside scheduler to fire this, because GitHub's own is
  # best-effort. Prefer the first: it needs a strictly smaller token.
  #
  # 1. workflow_dispatch over the API -- fine-grained PAT, this repository
  #    only, **Actions: read and write**. That permission can start and cancel
  #    workflow runs and nothing else; it cannot change a single file here.
  #
  #      POST /repos/echoatlasarchive/FundScraperBot/actions/workflows/daily.yml/dispatches
  #      {"ref": "main"}
  #
  # 2. repository_dispatch below -- needs **Contents: read and write**, which
  #    also lets the holder push commits to this repository. Same result, more
  #    power in a token that lives on someone else's server, so only use it if
  #    the calling service cannot send the first request.
  #
  #      POST /repos/echoatlasarchive/FundScraperBot/dispatches
  #      {"event_type": "daily-report"}
  #
  # Either way the token belongs in the calling service and never in this
  # repository. Both paths run with --only-if-new, exactly like a cron, so
  # firing them repeatedly is harmless and cannot produce a duplicate report.
  repository_dispatch:
    types: [daily-report]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: false
      force:
        description: "Send even outside the delivery window, and even if the session was already reported"
        type: boolean
        default: false
      resend:
        description: "Re-send the stored session to the owner only, fetching nothing from TEFAS"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Scanning the traded universe (~1,370 funds) takes about 10 minutes and
    # the KAP pass another 7, so the budget has headroom over that.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # KAP's disclosure list is only reachable through a real browser; see the
      # module docstring in src/kap.py. Cached so the ~100 MB download does not
      # repeat on every run.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Fetch, store and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEFAS_TOKEN: ${{ secrets.TEFAS_TOKEN }}
        run: |
          # Every attempt stays quiet unless TEFAS has published a session we
          # have not already reported, and the CLI refuses to deliver outside
          # the Istanbul window whatever fires it. "force" lifts both, for the
          # rare deliberate re-send; a plain dispatch is safe at any hour and
          # still prints the report into this log.
          python -m src.cli daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.resend && '--no-fetch --owner-only --force' || (inputs.force && '--force' || '--only-if-new') }}

      - name: Commit the snapshot
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            # The scheduled runs never overlap, but a manual dispatch might.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
