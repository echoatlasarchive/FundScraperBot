name: Daily report

on:
  schedule:
    # 08:20 UTC == 11:20 Istanbul, once, on weekdays.
    #
    # The hour is set by when TEFAS finishes, not by when we would like the
    # report. Measured 2026-08-20: a run that fetched at 10:29 Istanbul found
    # eighteen funds still unpriced, PHE among them, and the owner -- watching
    # the platform from 09:00 that morning -- put the point at which most funds
    # are settled at about 11:00. So the fetch starts after that, and the
    # report still lands well before the 13:30 fund-order cutoff.
    #
    # One attempt, not five. The earlier hourly schedule existed to absorb
    # GitHub's queue delay, but every extra attempt fired before TEFAS was
    # ready, and the completeness gate was the only thing standing between an
    # early attempt and a wrong report -- which it failed to be, once. Starting
    # late enough that the data is there is the simpler guarantee.
    #
    # The cost of the single attempt: if GitHub skips this cron (it does skip
    # them -- four of five were skipped on 2026-08-20) or TEFAS is unusually
    # late, there is no second chance and no report that day. The run sends a
    # Telegram alert when it declines to report, so that is visible rather than
    # silent, and daily.yml can be dispatched by hand.
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: false
      force:
        description: "Send even outside the delivery window, and even if the session was already reported"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Scanning the traded universe (~1,370 funds) takes about 10 minutes and
    # the KAP pass another 7, so the budget has headroom over that.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # KAP's disclosure list is only reachable through a real browser; see the
      # module docstring in src/kap.py. Cached so the ~100 MB download does not
      # repeat on every run.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Fetch, store and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEFAS_TOKEN: ${{ secrets.TEFAS_TOKEN }}
        run: |
          # Every attempt stays quiet unless TEFAS has published a session we
          # have not already reported, and the CLI refuses to deliver outside
          # the Istanbul window whatever fires it. "force" lifts both, for the
          # rare deliberate re-send; a plain dispatch is safe at any hour and
          # still prints the report into this log.
          python -m src.cli daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '--only-if-new' }}

      - name: Commit the snapshot
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            # The scheduled runs never overlap, but a manual dispatch might.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
