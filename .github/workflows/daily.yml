name: Daily report

on:
  schedule:
    # 08:20 UTC == 11:20 Istanbul, once, on weekdays. Owner's decision, twice
    # stated: one attempt, and it reports whatever it finds.
    #
    # The hour is set by when TEFAS finishes. Measured 2026-08-20: a run that
    # fetched at 10:29 Istanbul found eighteen funds still unpriced, and the
    # owner puts the point at which most funds are settled at about 11:00.
    # Nothing may fetch before that -- see HANDOFF 4a.
    #
    # GitHub fires these 40 to 100 minutes late and sometimes not at all
    # (2026-08-24 and the 11:20 slot on 2026-08-25 were both skipped). A second
    # attempt was tried for a day and removed again on request. So a skipped
    # cron means no report that day, and the only signal is its absence: the
    # run cannot warn about itself failing to start. Dispatch by hand when that
    # happens.
    - cron: "20 8 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: false
      force:
        description: "Send even outside the delivery window, and even if the session was already reported"
        type: boolean
        default: false
      resend:
        description: "Re-send the stored session to the owner only, fetching nothing from TEFAS"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Scanning the traded universe (~1,370 funds) takes about 10 minutes and
    # the KAP pass another 7, so the budget has headroom over that.
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # KAP's disclosure list is only reachable through a real browser; see the
      # module docstring in src/kap.py. Cached so the ~100 MB download does not
      # repeat on every run.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Fetch, store and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEFAS_TOKEN: ${{ secrets.TEFAS_TOKEN }}
        run: |
          # Every attempt stays quiet unless TEFAS has published a session we
          # have not already reported, and the CLI refuses to deliver outside
          # the Istanbul window whatever fires it. "force" lifts both, for the
          # rare deliberate re-send; a plain dispatch is safe at any hour and
          # still prints the report into this log.
          python -m src.cli daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.resend && '--no-fetch --owner-only --force' || (inputs.force && '--force' || '--only-if-new') }}

      - name: Commit the snapshot
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            # The scheduled runs never overlap, but a manual dispatch might.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
