name: Daily report

on:
  # GitHub's own scheduler is not the trigger here -- see HANDOFF for why.
  # Measured over the first seven weekdays it ran 9 to 100 minutes late
  # whenever it ran, and skipped the day outright twice, which is worse than
  # unreliable timing: a run that never starts cannot even warn about itself.
  #
  # An external scheduler (cron-job.org) calls this endpoint twice on weekdays,
  # 12:10 and 12:30 Istanbul, both after TEFAS has finished (about 11:00 --
  # fetching earlier is what printed PHE at -100%, HANDOFF 4a):
  #
  #   POST /repos/echoatlasarchive/FundScraperBot/actions/workflows/daily.yml/dispatches
  #   { "ref": "main" }
  #
  # using a fine-grained PAT scoped to this repository alone, with Actions:
  # read and write -- a permission that can start and cancel workflow runs and
  # nothing else. The token lives in that scheduler's configuration and is
  # never committed here. Both attempts run with --only-if-new, exactly like a
  # cron would, so firing this twice is harmless and cannot send a duplicate
  # report; the second one costs seconds once the first has succeeded.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the report instead of sending it"
        type: boolean
        default: false
      force:
        description: "Send even outside the delivery window, and even if the session was already reported"
        type: boolean
        default: false
      resend:
        description: "Re-send the stored session to the owner only, fetching nothing from TEFAS"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fundbot-data
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # Scanning the traded universe (~1,370 funds) takes about 10 minutes and
    # the KAP pass another 7, so the budget has headroom over that.
    timeout-minutes: 50

    steps:
      # ref: main is explicit and not the default on purpose. Without it,
      # checkout resolves to the commit "main" pointed to when this run was
      # *dispatched*, not when it actually starts -- and this workflow shares
      # a concurrency group, so a run can sit queued for the ~25 minutes
      # another run takes. On 2026-08-27 two attempts landed five minutes
      # apart (12:10 and 12:30 Istanbul); the second waited correctly for the
      # first to finish, but its checkout still fetched the pre-dispatch
      # commit, missed the snapshot the first run had just pushed, and reran
      # the whole fetch-and-send pipeline as if nothing had happened -- a
      # duplicate report, only caught (as a failure, not a rollback) when its
      # own push hit a conflict on the file the first run had already added.
      # Naming the branch here makes checkout re-resolve it at execution time.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # KAP's disclosure list is only reachable through a real browser; see the
      # module docstring in src/kap.py. Cached so the ~100 MB download does not
      # repeat on every run.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Fetch, store and send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TEFAS_TOKEN: ${{ secrets.TEFAS_TOKEN }}
        run: |
          # Every attempt stays quiet unless TEFAS has published a session we
          # have not already reported, and the CLI refuses to deliver outside
          # the Istanbul window whatever fires it. "force" lifts both, for the
          # rare deliberate re-send; a plain dispatch is safe at any hour and
          # still prints the report into this log.
          python -m src.cli daily \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.resend && '--no-fetch --owner-only --force' || (inputs.force && '--force' || '--only-if-new') }}

      - name: Commit the snapshot
        run: |
          git config user.name "fundbot"
          git config user.email "fundbot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: snapshot $(date -u +%Y-%m-%d)"
            # The scheduled runs never overlap, but a manual dispatch might.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi
